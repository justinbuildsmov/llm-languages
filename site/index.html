<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-languages</title>
<meta name="description" content="Ask 7 models what to eat for breakfast in 10 languages — the menu changes with the language. A 700-answer experiment.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=ZCOOL+XiaoWei&family=Italiana&family=Rozha+One&family=Aref+Ruqaa:wght@700&family=Galada&family=Russo+One&family=Abril+Fatface&family=Amarante&family=Gulzar&family=Source+Sans+3:wght@400;600&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
  :root {
    --page:#101014; --surface:#1a1a20; --ink:#f2ede3; --ink2:#b9b3a6; --muted:#7d7870;
    --border:rgba(255,255,255,.10); --claude:#d95926; --gpt:#3987e5;
  }
  * { box-sizing:border-box; }
  html { height:100%; }
  body {
    margin:0; min-height:100dvh; display:flex; flex-direction:column;
    background:var(--page); color:var(--ink);
    font-family:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:17px; line-height:1.6;
  }
  a:focus-visible, button:focus-visible { outline:2px solid var(--gpt); outline-offset:3px; border-radius:2px; }

  header, footer {
    display:flex; justify-content:space-between; align-items:baseline;
    gap:16px; padding:22px 30px; flex-wrap:wrap;
    position:relative; z-index:1;
  }
  .wordmark {
    font-family:"Spline Sans Mono", ui-monospace, monospace; font-weight:500;
    font-size:1rem; color:var(--ink); text-decoration:none; letter-spacing:.01em;
  }
  .quiet { color:var(--ink2); text-decoration:none; font-size:.92rem; }
  .quiet:hover { color:var(--ink); }

  main {
    flex:1; position:relative; z-index:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:24px 20px 48px;
    pointer-events:none; /* let clicks reach the bubbles; controls re-enable below */
  }
  main a, main button, .q-stage { pointer-events:auto; }

  /* floating glass bubbles — glyphs from the ten scripts, click to pop */
  .bubbles { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .bubble {
    position:absolute; top:0; left:0; border-radius:50%;
    pointer-events:auto; cursor:pointer; user-select:none;
    -webkit-backdrop-filter:blur(3px) saturate(1.6) brightness(1.12);
    backdrop-filter:blur(3px) saturate(1.6) brightness(1.12);
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.26), rgba(255,255,255,.05) 46%, rgba(255,255,255,0) 62%),
      radial-gradient(circle at 72% 82%, rgba(255,255,255,.10), rgba(255,255,255,0) 55%);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:
      inset 2px 3px 7px rgba(255,255,255,.28),
      inset -4px -6px 12px rgba(255,255,255,.05),
      0 10px 30px rgba(0,0,0,.30);
    display:flex; align-items:center; justify-content:center;
    will-change:transform; opacity:.92;
  }
  .bubble::after {
    content:""; position:absolute; top:13%; left:19%; width:27%; height:15%;
    border-radius:50%; background:rgba(255,255,255,.4); filter:blur(3px);
    transform:rotate(-20deg); pointer-events:none;
  }
  .bubble .g { position:relative; color:var(--ink); opacity:.72; line-height:1; pointer-events:none; }
  .bubble.popping { transition:opacity .18s ease, filter .18s ease; opacity:0; filter:blur(3px); }
  @media (prefers-reduced-motion: reduce){ .bubble.popping { transition:none; } }
  .q-stage { position:relative; width:min(1020px,100%); min-height:clamp(150px, 26vw, 210px); margin:0; font-weight:400; }
  .q {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:0 8px; font-size:clamp(1.65rem, 5.4vw, 3.4rem); line-height:1.35;
    opacity:0; visibility:hidden; transform:translateY(12px); filter:blur(7px);
    transition:opacity .55s ease, transform .55s ease, filter .55s ease, visibility 0s .55s;
  }
  .q.on { opacity:1; visibility:visible; transform:none; filter:none; transition-delay:0s; }
  .f-en { font-family:"IM Fell English", serif; }
  .f-zh { font-family:"ZCOOL XiaoWei", serif; font-size:.95em; }
  .f-hi { font-family:"Rozha One", serif; font-size:.9em; line-height:1.45; }
  .f-es { font-family:"Abril Fatface", serif; font-size:.9em; }
  .f-fr { font-family:"Italiana", serif; font-size:1.04em; }
  .f-ar { font-family:"Aref Ruqaa", serif; font-weight:700; font-size:.95em; line-height:1.7; }
  .f-bn { font-family:"Galada", cursive; font-size:.95em; line-height:1.55; }
  .f-pt { font-family:"Amarante", serif; font-size:.9em; }
  .f-ru { font-family:"Russo One", sans-serif; font-size:.8em; }
  .f-ur { font-family:"Gulzar", serif; font-size:.78em; line-height:2.1; }

  .r-stage { position:relative; width:min(780px,100%); min-height:96px; margin-top:4px; }
  .r {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; gap:5px; padding:0 8px;
    color:var(--ink2); font-size:1.04rem;
    opacity:0; visibility:hidden; transform:translateY(8px);
    transition:opacity .55s ease .12s, transform .55s ease .12s, visibility 0s .67s;
  }
  .r.on { opacity:1; visibility:visible; transform:none; transition-delay:.12s; }
  .r strong { color:var(--ink); font-weight:600; }
  .r .pct { font-family:"Spline Sans Mono", ui-monospace, monospace; font-size:.78rem; color:var(--muted); letter-spacing:.04em; }

  .langs { display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:center; margin:26px 0 38px; max-width:640px; }
  .langs button {
    font:inherit; font-size:.86rem; background:none; border:0; cursor:pointer;
    color:var(--muted); padding:1px 2px; border-bottom:1px solid transparent; line-height:1.9;
  }
  .langs button:hover { color:var(--ink2); }
  .langs button[aria-pressed="true"] { color:var(--ink); border-bottom-color:var(--ink); }

  .cta { display:flex; align-items:center; justify-content:center; gap:28px; flex-wrap:wrap; }
  .btn {
    background:var(--ink); color:var(--page); text-decoration:none;
    font-weight:600; font-size:1.03rem; padding:13px 34px; border-radius:999px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform:translateY(-1px); box-shadow:0 12px 32px rgba(242,237,227,.14); }
  .link { color:var(--ink2); font-size:.98rem; text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1px; }
  .link:hover { color:var(--ink); }

  footer { color:var(--muted); font-size:.83rem; }

  .sr-only {
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  @media (max-width:560px){
    header, footer { padding:18px 20px; }
    footer { flex-direction:column; align-items:center; gap:4px; text-align:center; }
    .eyebrow { letter-spacing:.16em; margin-bottom:26px; }
    .r-stage { min-height:118px; }
  }
  @media (prefers-reduced-motion: reduce){
    .q, .r, .btn { transition:none; }
    .q { transform:none; filter:none; }
    .r { transform:none; }
  }
</style>
</head>
<body>

<div class="bubbles" id="bubbles" aria-hidden="true"></div>

<header>
  <a class="wordmark" href="./">llm-languages</a>
  <a class="quiet" href="https://github.com/justinbuildsmov/llm-languages">github&nbsp;↗</a>
</header>

<main>
  <h1 class="q-stage" id="q-stage">
    <span class="sr-only">What should I have for breakfast? — one question, asked in ten languages.</span>
  </h1>
  <div class="r-stage" id="r-stage" aria-hidden="true"></div>
  <nav class="langs" id="langs" aria-label="Pick a language"></nav>
  <div class="cta">
    <a class="btn" href="paper.html">Read the paper</a>
    <a class="link" href="https://github.com/justinbuildsmov/llm-languages">view on github ↗</a>
  </div>
</main>

<footer>
  <span>by Justin Sun</span>
</footer>

<script>
const LANGS = [
  { c:"en", name:"English",    native:"English",   dir:"ltr", q:"What should I have for breakfast?",
    d:"yogurt, toast & oatmeal",        pct:"the global default menu" },
  { c:"zh", name:"Mandarin",   native:"中文",       dir:"ltr", q:"我早餐应该吃什么？",
    d:"fresh soy milk, congee & youtiao", pct:"99% named a local dish" },
  { c:"hi", name:"Hindi",      native:"हिन्दी",      dir:"ltr", q:"मुझे नाश्ते में क्या खाना चाहिए?",
    d:"paratha, poha, idli & dosa",     pct:"100% named a local dish" },
  { c:"es", name:"Spanish",    native:"Español",   dir:"ltr", q:"¿Qué debería desayunar?",
    d:"oatmeal, yogurt & avocado",      pct:"the same default menu" },
  { c:"fr", name:"French",     native:"Français",  dir:"ltr", q:"Que devrais-je manger au petit-déjeuner ?",
    d:"croissants & tartines",          pct:"44% named a local dish" },
  { c:"ar", name:"Arabic",     native:"العربية",    dir:"rtl", q:"ماذا يجب أن آكل على الإفطار؟",
    d:"ful, hummus & falafel",          pct:"77% named a local dish" },
  { c:"bn", name:"Bengali",    native:"বাংলা",      dir:"ltr", q:"আমার সকালের নাস্তায় কী খাওয়া উচিত?",
    d:"paratha & khichuri",             pct:"64% named a local dish" },
  { c:"pt", name:"Portuguese", native:"Português", dir:"ltr", q:"O que eu deveria comer no café da manhã?",
    d:"pão de queijo & tapioca",        pct:"71% named a local dish" },
  { c:"ru", name:"Russian",    native:"Русский",   dir:"ltr", q:"Что мне съесть на завтрак?",
    d:"kasha, syrniki & tvorog",        pct:"76% named a local dish" },
  { c:"ur", name:"Urdu",       native:"اردو",       dir:"rtl", q:"مجھے ناشتے میں کیا کھانا چاہیے؟",
    d:"paratha & halwa puri",           pct:"99% named a local dish" },
];

const qStage = document.getElementById("q-stage");
const rStage = document.getElementById("r-stage");
const langsNav = document.getElementById("langs");
const qs = [], rs = [], tabs = [];

LANGS.forEach((L, i) => {
  const q = document.createElement("span");
  q.className = "q f-" + L.c;
  q.dir = L.dir;
  q.lang = L.c;
  q.textContent = L.q;
  q.setAttribute("aria-hidden", "true");
  qStage.appendChild(q); qs.push(q);

  const r = document.createElement("span");
  r.className = "r";
  const line = document.createElement("span");
  line.append("Asked in " + L.name + ", the models reached for ");
  const strong = document.createElement("strong");
  strong.textContent = L.d;
  line.append(strong, ".");
  const pct = document.createElement("span");
  pct.className = "pct";
  pct.textContent = L.pct;
  r.append(line, pct);
  rStage.appendChild(r); rs.push(r);

  const b = document.createElement("button");
  b.type = "button";
  b.textContent = L.native;
  b.lang = L.c;
  b.setAttribute("aria-pressed", "false");
  b.setAttribute("aria-label", L.name);
  b.addEventListener("click", () => { show(i); hold(9000); });
  langsNav.appendChild(b); tabs.push(b);
});

let idx = 0, timer = null, holdTimer = null;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PERIOD = 3400;

function show(i){
  idx = i;
  qs.forEach((q, j) => q.classList.toggle("on", j === i));
  rs.forEach((r, j) => r.classList.toggle("on", j === i));
  tabs.forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
}
function start(){ if (reduceMotion || timer) return; timer = setInterval(() => show((idx + 1) % LANGS.length), PERIOD); }
function stop(){ clearInterval(timer); timer = null; }
function hold(ms){ stop(); clearTimeout(holdTimer); holdTimer = setTimeout(() => { holdTimer = null; start(); }, ms); }

qStage.addEventListener("mouseenter", stop);
qStage.addEventListener("mouseleave", () => { if (!holdTimer) start(); });

show(0);
start();

// --- floating glass bubbles ---
const GLYPHS = [
  ["B","f-en"], ["早","f-zh"], ["न","f-hi"], ["¿","f-es"], ["é","f-fr"],
  ["ف","f-ar"], ["খ","f-bn"], ["ã","f-pt"], ["З","f-ru"], ["چ","f-ur"],
];
const field = document.getElementById("bubbles");
const bubbles = [];
const COUNT = matchMedia("(max-width: 560px)").matches ? 6 : 10;

function spawnBubble(gi, atEdge){
  const [ch, cls] = GLYPHS[gi];
  const size = 46 + Math.random() * 62;
  const el = document.createElement("div");
  el.className = "bubble";
  el.style.width = el.style.height = size.toFixed(0) + "px";
  const g = document.createElement("span");
  g.className = "g " + cls;
  g.textContent = ch;
  g.style.fontSize = (size * .4).toFixed(0) + "px";
  el.appendChild(g);
  field.appendChild(el);

  const W = innerWidth, H = innerHeight;
  // spawn clear of the central text band
  let px = Math.random() * (W - size), py = Math.random() * (H - size);
  for (let t = 0; t < 24; t++){
    const cx = px + size / 2, cy = py + size / 2;
    if (cx < W * .15 || cx > W * .85 || cy < H * .17 || cy > H * .86) break;
    px = Math.random() * (W - size); py = Math.random() * (H - size);
  }
  const b = {
    el, gi, size,
    x: atEdge ? (Math.random() < .5 ? -size : W) : px,
    y: py,
    vx: (Math.random() < .5 ? -1 : 1) * (8 + Math.random() * 12),
    vy: (Math.random() < .5 ? -1 : 1) * (6 + Math.random() * 10),
    phase: Math.random() * Math.PI * 2,
    dead: false,
  };
  b.base = Math.hypot(b.vx, b.vy);
  el.addEventListener("click", () => popBubble(b));
  bubbles.push(b);
  drawBubble(b, 0);
}

function drawBubble(b, t){
  const bob = Math.sin(t / 1000 + b.phase) * 4;
  b.el.style.transform = "translate3d(" + b.x.toFixed(1) + "px," + (b.y + bob).toFixed(1) + "px,0)" + (b.dead ? " scale(1.3)" : "");
}

function popBubble(b){
  if (b.dead) return;
  b.dead = true;
  b.el.classList.add("popping");
  drawBubble(b, performance.now());
  setTimeout(() => b.el.remove(), 200);
  setTimeout(() => {
    bubbles.splice(bubbles.indexOf(b), 1);
    spawnBubble(b.gi, true);
  }, 2500 + Math.random() * 3500);
}

for (let i = 0; i < COUNT; i++) spawnBubble(i, false);

const mouse = { x:-1e4, y:-1e4 };
addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
document.addEventListener("pointerleave", () => { mouse.x = mouse.y = -1e4; });

if (!reduceMotion){
  let last = performance.now();
  (function tick(now){
    const dt = Math.min(50, now - last) / 1000; last = now;
    const W = innerWidth, H = innerHeight;
    for (const b of bubbles){
      if (b.dead) continue;
      const cx = b.x + b.size / 2, cy = b.y + b.size / 2;
      // keep clear of the whole content column; prefer pushing out to the sides
      const L = W * .15, R = W * .85, T = H * .17, B = H * .86, PAD = 50;
      const pl = cx - (L - PAD), pr = (R + PAD) - cx, pt = cy - (T - PAD), pb = (B + PAD) - cy;
      if (pl > 0 && pr > 0 && pt > 0 && pb > 0){
        const opts = [[pl, -1, 0], [pr, 1, 0], [pt * 1.35, 0, -1], [pb * 1.35, 0, 1]];
        opts.sort((a, o) => a[0] - o[0]);
        const [cost, fx, fy] = opts[0];
        const push = 340 * Math.min(1, cost / 220);
        b.vx += fx * push * dt;
        b.vy += fy * push * dt;
      }
      // slight repulsion from the cursor
      const mdx = cx - mouse.x, mdy = cy - mouse.y, MR = 170;
      const md2 = mdx * mdx + mdy * mdy;
      if (md2 < MR * MR){
        const md = Math.sqrt(md2) || .001;
        const push = (1 - md / MR) * 460;
        b.vx += (mdx / md) * push * dt;
        b.vy += (mdy / md) * push * dt;
      }
      // ease back to each bubble's natural drift speed
      const sp = Math.hypot(b.vx, b.vy) || .001;
      const f = 1 + (b.base / sp - 1) * Math.min(1, dt * 1.4);
      b.vx *= f; b.vy *= f;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -b.size * 1.5) { b.x = -b.size * 1.5; b.vx = Math.abs(b.vx); }
      if (b.x > W - b.size * .5) { b.x = W - b.size * .5; b.vx = -Math.abs(b.vx); }
      if (b.y < -b.size * .5) { b.y = -b.size * .5; b.vy = Math.abs(b.vy); }
      if (b.y > H - b.size * .5) { b.y = H - b.size * .5; b.vy = -Math.abs(b.vy); }
      drawBubble(b, now);
    }
    requestAnimationFrame(tick);
  })(last);
}
</script>
</body>
</html>
